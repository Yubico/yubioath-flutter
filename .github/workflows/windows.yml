name: Windows

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read variables from repo
        shell: bash
        run: |
          cat .github/workflows/env >> $GITHUB_ENV
          echo CACHE_KEY=${{ runner.os }}-rust-c52f5fc-svc1-${{ hashFiles('build-helper.bat', 'helper/**')}} >> $GITHUB_ENV

      - name: Check app versions
        run: |
          python set-version.py
          git diff --exit-code

      - name: Test signed artifact extraction
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check out helper dependencies
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/Yubico/yubikey-manager.git ../yubikit-rs
          git -C ../yubikit-rs checkout c52f5fcdefbb7097f8e036dc022ac33236c3e87a

      - name: Cache helper
        id: cache-helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/windows/helper
            build/windows/ykman-svc.exe
            assets/licenses/helper.txt
          key: ${{ env.CACHE_KEY }}

      - name: Install Rust toolchain
        if: steps.cache-helper.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-about
        if: steps.cache-helper.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2
          fallback: none

      - name: Build the Helper
        if: steps.cache-helper.outputs.cache-hit != 'true'
        run: .\build-helper.bat

      - name: Build ykman-svc
        if: steps.cache-helper.outputs.cache-hit != 'true'
        run: |
          cargo build --release --manifest-path ..\yubikit-rs\Cargo.toml -p ykman-svc
          Copy-Item ..\yubikit-rs\target\release\ykman-svc.exe build\windows\ykman-svc.exe

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER }}
      - run: flutter config --enable-windows-desktop
      - run: flutter --version
      - run: flutter pub get

      - name: Run lints/tests
        run: |
          pipx run pre-commit run --all-files
          flutter test

      - name: Build the app
        run: |
          $version = python set-version.py | select-object -first 1
          flutter build windows --build-name=$version

      - name: Check generated files
        run: git diff -I '.*android.*flutter_plugins.*qrscanner_zxing' --exit-code

      - name: Rename and archive app bundle
        run: |
          $arr = $env:GITHUB_REF -split '/'
          $branch = $arr[2]
          $dest = "deploy\yubioath-desktop-$branch-windows"
          mkdir $dest
          mv build\windows\x64\runner\Release\* $dest\
          cp build\windows\ykman-svc.exe deploy\
          mv resources\win\release-win.ps1 deploy
          mv resources\win\verify_dll.ps1 deploy
          mv resources deploy

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yubioath-desktop-windows
          path: deploy

  sign-source:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: Check tag format
      run: |
        if [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
          echo "Tag matches format"
        else
          echo "Invalid tag format"
          exit 1
        fi

    - name: checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: yubioath-desktop-windows
        path: yubioath-desktop-windows

    - name: docker login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ci@yubico.com
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: write service account credentials
      env:
        GAC: ${{ secrets.SCRIBE_SA }}
      run: |
        echo "${GAC}" > scribe_sa.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

    - name: run scribe exe dll
      run: >
        docker run
        --user $(id -u):$(id -g)
        --volume $(pwd):/scribe
        --env-file <(env)
        ghcr.io/yubico/scribe-ci:v1
        --project-id scribe-prod-987134
        --bucket scribe-u-pub-yubioath-flutter-f94pro
        --config /scribe/.github/scribe-sign-exe-dll.yml
        submit .
        --synchronous
        --download-artifacts

    - name: unpack signed artifacts
      run: |
        mkdir -p signed
        mv scribe-download/*/sign-source/1.zip signed/
        python3 .github/scripts/extract_signed_zip.py signed/1.zip signed
        rm signed/1.zip
        cp signed/authenticator-helper.exe yubioath-desktop-windows/*/helper/authenticator-helper.exe
        cp signed/authenticator.exe yubioath-desktop-windows/*/authenticator.exe
        cp signed/ykman-svc.exe yubioath-desktop-windows/ykman-svc.exe
        cp signed/desktop_drop_plugin.dll yubioath-desktop-windows/*/desktop_drop_plugin.dll
        cp signed/flutter_windows.dll yubioath-desktop-windows/*/flutter_windows.dll
        cp signed/local_notifier_plugin.dll yubioath-desktop-windows/*/local_notifier_plugin.dll
        cp signed/screen_retriever_windows_plugin.dll yubioath-desktop-windows/*/screen_retriever_windows_plugin.dll
        cp signed/cnativeapi.dll yubioath-desktop-windows/*/cnativeapi.dll
        cp signed/url_launcher_windows_plugin.dll yubioath-desktop-windows/*/url_launcher_windows_plugin.dll
        cp signed/window_manager_plugin.dll yubioath-desktop-windows/*/window_manager_plugin.dll
        cp signed/dartjni.dll yubioath-desktop-windows/*/dartjni.dll

    - name: upload signed artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: signed-files
        path: yubioath-desktop-windows
        if-no-files-found: error
        compression-level: 0

  build-msi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sign-source]
    runs-on: windows-latest
    steps:
      - name: Check tag format
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Tag matches format"
          else
            echo "Invalid tag format"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download /signed dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-files
          path: signed-files

      - name: Read variables from repo
        shell: bash
        run: cat .github/workflows/env >> $GITHUB_ENV

      - name: Create an unsigned .msi installer package
        run: |
          $arr = $env:GITHUB_REF -split '/'
          $branch = $arr[2]
          $env:PATH += ";$env:WIX\bin"
          $env:SRCDIR = "signed-files\yubioath-desktop-$branch-windows\"
          $serviceSource = (Resolve-Path signed-files\ykman-svc.exe).Path
          heat dir .\signed-files\yubioath-desktop-$branch-windows\ -out fragment.wxs -gg -scom -srd -sfrag -dr INSTALLDIR -cg ApplicationFiles -var env.SRCDIR
          candle .\fragment.wxs .\resources\win\yubioath-desktop.wxs "-dServiceSource=$serviceSource" -ext WixUtilExtension -arch x64
          light fragment.wixobj yubioath-desktop.wixobj -ext WixUIExtension -ext WixUtilExtension -o yubioath-desktop.msi

      - name: Rename and archive app bundle
        run: |
          $arr = $env:GITHUB_REF -split '/'
          $branch = $arr[2]
          $dest = "installer\yubioath-desktop-$branch-windows"
          mkdir installer
          mv yubioath-desktop.msi installer

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: installer

  build-msix:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sign-source]
    runs-on: windows-latest
    steps:
      - name: Check tag format
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Tag matches format"
          else
            echo "Invalid tag format"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download /signed dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-files
          path: signed-files

      - name: Create an unsigned .msix package for the Microsoft Store
        run: |
          $arr = $env:GITHUB_REF -split '/'
          $branch = $arr[2]
          # The Store requires every uploaded package to have a unique version
          # (x.y.z.0, 4th field reserved), so encode the rc number into the
          # third field: x.y.(z*100+rcN).0. E.g. 7.4.2-rc.6 -> 7.4.206.0.
          # This only affects the MSIX package identity, not the app itself.
          $base, $rc = $branch -split '-rc\.'
          $v = $base -split '\.'
          $version = "$($v[0]).$($v[1]).$([int]$v[2] * 100 + [int]$rc).0"
          $pkg = "msix-pkg"
          mkdir $pkg
          cp -Recurse signed-files\yubioath-desktop-$branch-windows\* $pkg\
          cp signed-files\ykman-svc.exe $pkg\
          cp -Recurse resources\win\msix\Assets $pkg\Assets
          (Get-Content resources\win\msix\AppxManifest.xml) -replace '\$VERSION\$', $version | Set-Content $pkg\AppxManifest.xml -Encoding utf8
          $sdkBin = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).DirectoryName
          # Index the scale-qualified logo assets so the manifest references resolve
          & "$sdkBin\makepri.exe" createconfig /cf priconfig.xml /dq en-US /o
          & "$sdkBin\makepri.exe" new /pr $pkg /cf priconfig.xml /mn $pkg\AppxManifest.xml /of $pkg\Resources.pri /o
          & "$sdkBin\makeappx.exe" pack /d $pkg /p yubioath-desktop.msix /o /l
          mkdir msix-installer
          mv yubioath-desktop.msix msix-installer

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-msix
          path: msix-installer
          if-no-files-found: error

  sign-msi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-msi]
    runs-on: ubuntu-latest
    steps:
    - name: Check tag
      run: |
        if [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
          echo "Tag matches format"
        else
          echo "Invalid tag format"
          exit 1
        fi

    - name: checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: installer
        path: installer

    - name: docker login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ci@yubico.com
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: write service account credentials
      env:
        GAC: ${{ secrets.SCRIBE_SA }}
      run: |
        echo "${GAC}" > scribe_sa.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

    - name: run scribe msi
      run: >
        docker run
        --user $(id -u):$(id -g)
        --volume $(pwd):/scribe
        --env-file <(env)
        ghcr.io/yubico/scribe-ci:v1
        --project-id scribe-prod-987134
        --bucket scribe-u-pub-yubioath-flutter-f94pro
        --config /scribe/.github/scribe-sign-msi.yml
        submit .
        --synchronous
        --download-artifacts

    - name: unpack signed artifacts-msi
      run: |
        mkdir -p signed
        mv scribe-download/*/sign-source/1.zip signed/
        python3 .github/scripts/extract_signed_zip.py signed/1.zip signed
        rm signed/1.zip

    - name: upload signed artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: signed-installer
        path: signed/*
        if-no-files-found: error
        compression-level: 0

  verify-signatures:
    needs: [sign-msi]
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-files
          path: downloaded-artifact

      - name: Check for unsigned executables and DLLs
        working-directory: .\downloaded-artifact
        run: .\verify_dll.ps1
