name: "CodeQL"

on:
  push:
    paths:
      - "android/**"
      - "helper/**"
      - ".github/workflows/codeql-analysis.yml"
  pull_request:
    paths:
      - "android/**"
      - "helper/**"
      - ".github/workflows/codeql-analysis.yml"
  schedule:
    - cron: '0 11 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: kotlin
            build-mode: manual

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'app'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: set up JDK 21
        if: matrix.language == 'kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        if: matrix.language == 'kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Read variables from repo
        if: matrix.language == 'kotlin'
        run: cat .github/workflows/env >> $GITHUB_ENV
        working-directory: ./app

      - name: Install Flutter
        if: matrix.language == 'kotlin'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER }}
          cache: true
          pub-cache: true
      - if: matrix.language == 'kotlin'
        run: |
          flutter config
          flutter --version
          flutter pub get
        working-directory: ./app

      - if: matrix.language == 'kotlin'
        name: Build the App
        run: android/scripts/build.sh
        env:
          GRADLE_OPTS: -Dorg.gradle.caching=false
          YUBIOATH_STORE_BASE64: ${{ secrets.YUBIOATH_STORE_BASE64 }}
          YUBIOATH_KEY_ALIAS: ${{ secrets.YUBIOATH_KEY_ALIAS }}
          YUBIOATH_KEY_PASSWORD: ${{ secrets.YUBIOATH_KEY_PASSWORD }}
          YUBIOATH_STORE_PASSWORD: ${{ secrets.YUBIOATH_STORE_PASSWORD }}
        working-directory: ./app

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
