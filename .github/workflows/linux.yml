name: Linux

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: .github/workflows/env

    - name: Read variables from repo
      run: |
        cat .github/workflows/env >> $GITHUB_ENV
        echo CACHE_KEY=${{ runner.os }}-${{ runner.arch }}-rust-7ba53ca-${{ hashFiles('build-helper.sh', 'helper/**')}} >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -qq curl software-properties-common libnotify-dev python3-venv
        add-apt-repository -y ppa:git-core/ppa
        apt-get install -qq git
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check app versions
      run: |
        python3 set-version.py
        git diff --exit-code

    - name: Check out helper dependencies
      run: |
        git clone --filter=blob:none https://github.com/Yubico/yubikey-manager.git ../yubikit-rs
        git -C ../yubikit-rs checkout 7ba53ca05c8f27b129dfcfa280409d76aa5eaf9c

    - name: Cache helper
      id: cache-helper
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/linux/helper
          assets/licenses/helper.txt
        key: ${{ env.CACHE_KEY }}

    - name: Install Rust toolchain
      if: steps.cache-helper.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Install cargo-about
      if: steps.cache-helper.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
      with:
        tool: cargo-about@0.9.2
        fallback: none

    - name: Build the Helper
      if: steps.cache-helper.outputs.cache-hit != 'true'
      run: |
        apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev build-essential cmake pkg-config libssl-dev
        ./build-helper.sh

    - name: Install Flutter dependencies
      run: |
        apt-get install -qq clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev jq lld

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: 'stable'
        flutter-version: ${{ env.FLUTTER }}
        cache: true
        pub-cache: true

    - name: Configure Flutter
      run: |
        git config --global --add safe.directory $FLUTTER_ROOT
        flutter config --enable-linux-desktop
        flutter --version
        flutter pub get

    - name: Build the app
      run: flutter build linux

    - name: Check generated files
      run: git diff --exit-code

    - name: Rename and archive app
      run: |
        export REF=$(echo ${GITHUB_REF} | cut -d '/' -f 3)
        export BASENAME="yubioath-desktop-${REF}-linux"
        mkdir deploy
        mv build/linux/x64/release/bundle "build/${BASENAME}"
        tar -czf deploy/${BASENAME}.tar.gz -C build "${BASENAME}"

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: yubioath-desktop-linux
        path: deploy

  test-helper:
    name: Rust helper checks (no hardware)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev build-essential cmake pkg-config libssl-dev

    - name: Check out helper dependencies
      run: |
        git clone --filter=blob:none https://github.com/Yubico/yubikey-manager.git ../yubikit-rs
        git -C ../yubikit-rs checkout 7ba53ca05c8f27b129dfcfa280409d76aa5eaf9c

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        components: clippy,rustfmt

    - name: Check Rust formatting
      run: cargo fmt --manifest-path helper/Cargo.toml --all -- --check

    - name: Run non-hardware helper tests
      run: cargo test --manifest-path helper/Cargo.toml --workspace --bins

    - name: Check helper with Clippy
      # Existing helper code triggers these three lints; keep all other warnings fatal.
      run: cargo clippy --manifest-path helper/Cargo.toml --workspace --all-targets -- -D warnings -A clippy::items_after_test_module -A clippy::type_complexity -A clippy::needless_borrow
