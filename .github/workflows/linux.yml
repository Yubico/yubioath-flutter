name: Linux

on: [push, pull_request]

jobs:
  build:
    name: Build - ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
            container: ubuntu:20.04
            sudo: ''
            channel: stable
            suffix: ''
          - arch: arm64
            os: ubuntu-22.04-arm
            container: ''
            sudo: sudo
            # https://github.com/subosito/flutter-action/issues/268
            channel: main
            suffix: '-arm64'
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"
      DEBIAN_FRONTEND: noninteractive

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: .github/workflows/env

    - name: Read variables from repo
      run: |
        cat .github/workflows/env >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        ${{ matrix.sudo }} apt-get update
        ${{ matrix.sudo }} apt-get install -qq curl libnotify-dev
        if [ '${{ matrix.arch }}' = 'x64' ]; then
          apt-get install -qq software-properties-common python3-venv
          add-apt-repository -y ppa:git-core/ppa
          apt-get install -qq git
        fi
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Set helper cache key
      run: echo CACHE_KEY=${{ runner.os }}-${{ runner.arch }}-rust-$(git -C yubikey-manager rev-parse HEAD)-${{ hashFiles('build-helper.sh', 'helper/**')}} >> $GITHUB_ENV

    - name: Check app versions
      run: |
        python3 set-version.py
        git diff --exit-code

    - name: Cache helper
      id: cache-helper
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/linux/helper
          assets/licenses/helper.txt
        key: ${{ env.CACHE_KEY }}

    - name: Install Rust toolchain
      if: steps.cache-helper.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: stable
        build-warnings: ""
        rustflags: ""
        cache: true
        cache-workspaces: helper
        cache-save-if: ${{ github.event_name == 'push' }}

    - name: Install cargo-about
      if: steps.cache-helper.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      with:
        tool: cargo-about@0.9.2
        fallback: none

    - name: Build the Helper
      if: steps.cache-helper.outputs.cache-hit != 'true'
      run: |
        ${{ matrix.sudo }} apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev build-essential cmake pkg-config libssl-dev
        ./build-helper.sh

    - name: Install Flutter dependencies
      run: |
        ${{ matrix.sudo }} apt-get install -qq unzip clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev jq lld

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: ${{ matrix.channel }}
        flutter-version: ${{ env.FLUTTER }}
        cache: true
        pub-cache: true

    - name: Configure Flutter
      run: |
        git config --global --add safe.directory $FLUTTER_ROOT
        flutter config --enable-linux-desktop
        flutter --version
        flutter pub get

    - name: Build the app
      run: flutter build linux

    - name: Check generated files
      run: git diff --exit-code

    - name: Rename and archive app
      shell: bash
      run: |
        REF="${GITHUB_REF_NAME//\//-}"
        BASENAME="yubioath-desktop-${REF}-linux${{ matrix.suffix }}"
        mkdir deploy
        mv build/linux/${{ matrix.arch }}/release/bundle "build/${BASENAME}"
        tar -czf deploy/${BASENAME}.tar.gz -C build "${BASENAME}"

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: yubioath-desktop-linux${{ matrix.suffix }}
        path: deploy
        if-no-files-found: error

  test-helper:
    name: Rust helper checks (no hardware)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev build-essential cmake pkg-config libssl-dev

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: stable
        components: clippy,rustfmt
        build-warnings: ""
        rustflags: ""
        cache: true
        cache-workspaces: helper
        cache-save-if: ${{ github.event_name == 'push' }}

    - name: Check Rust formatting
      run: cargo fmt --manifest-path helper/Cargo.toml -- --check

    - name: Run non-hardware helper tests
      run: cargo test --manifest-path helper/Cargo.toml --locked

    - name: Check helper with Clippy
      run: cargo clippy --manifest-path helper/Cargo.toml --locked --all-targets -- -D warnings
